plugins {
  alias deps.plugins.spotless
  alias deps.plugins.kotlinx.kover
  alias(deps.plugins.androidx.benchmark) apply false
  alias(deps.plugins.compose.compiler) apply false
}

spotless {
  groovyGradle {
    target "**/*.gradle"
    trimTrailingWhitespace()
    endWithNewline()
    greclipse().configFile('./greclipse.properties')
  }

  def ktlintConfig = [
    "indent_size"             : "2",
    "max_line_length"         : "80",
    "indent_style"            : "space",
    "charset"                 : "utf-8",
    "end_of_line"             : "lf",
    "ktlint_standard_filename": "disabled",
    "ktlint_standard_enum-entry-name-case": "disabled",
    "ktlint_standard_max-line-length": "disabled",
    "ktlint_standard_backing-property-naming": "disabled",
    "ktlint_standard_function-naming": "disabled",
    "ktlint_standard_class-naming": "disabled",
    "ktlint_standard_kdoc": "disabled",
    "ktlint_standard_property-naming": "disabled",
    "trim_trailing_whitespace": "true",
    "insert_final_newline"    : "true",
  ]
  def ktlintVersion = deps.versions.ktlint.get()
  kotlin {
    target "**/*.kt"
    targetExclude "buildSrc/build/"
    ktlint(ktlintVersion).editorConfigOverride(ktlintConfig)
  }
  kotlinGradle {
    target("**/*.kts")
    targetExclude "buildSrc/build/"
    ktlint(ktlintVersion).editorConfigOverride(ktlintConfig)
  }
}
